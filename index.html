<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>건축사사무소 스튜디오501</title>

  <meta
    name="description"
    content="건축사사무소 스튜디오501. 학교 공간재구조화, 리모델링 및 증·개축, 공공건축 프로젝트를 수행합니다."
  >

  <link rel="canonical" href="https://studio501seoul.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="건축사사무소 스튜디오501">
  <meta property="og:title" content="건축사사무소 스튜디오501">
  <meta
    property="og:description"
    content="학교 공간재구조화, 리모델링 및 증·개축, 공공건축 프로젝트를 수행합니다."
  >
  <meta property="og:url" content="https://studio501seoul.com/">
  <meta
    property="og:image"
    content="https://studio501seoul.com/images/deokyang-thumb.jpg"
  >

  <link rel="icon" href="/favicon.ico?v=99" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=3">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      overflow-x:hidden;
      font-family:Arial, "Malgun Gothic", sans-serif;
      background:#fff;
      color:#111;
    }

    /*
      About 페이지와 동일한 위치
      왼쪽 40px / 위쪽 44px
    */
    .container{
      width:calc(100% - 40px);
      margin:44px 0 80px 40px;
      padding:0;
    }

    /* 상단 로고 */
    .site-header{
      margin:0 0 52px;
    }

    .logo{
      display:inline-block;
      color:#111;
      font-size:14px;
      font-weight:600;
      letter-spacing:-0.02em;
      text-decoration:none;
    }

    .logo:hover{
      opacity:0.55;
    }

    /* 프로젝트가 보이는 영역 */
    .project-viewport{
      width:100%;
      overflow:hidden;
    }

    /* 프로젝트를 가로 한 줄로 배치 */
    .grid{
      display:flex;
      width:max-content;
      gap:32px;
      will-change:transform;
    }

    /*
      화면에 프로젝트 약 4개 표시
      오른쪽에는 다음 이미지 일부가 자연스럽게 이어짐
    */
    .project{
      display:block;
      flex:0 0 calc((100vw - 40px - 128px) / 4);
      min-width:280px;
      max-width:400px;
      color:#000;
      text-decoration:none;
    }

    .project-static{
      cursor:default;
      user-select:none;
    }

    .thumb{
      position:relative;
      width:100%;
      aspect-ratio:4 / 3;
      overflow:hidden;
      background:#f2f2f2;
    }

    .thumb img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      transition:
        filter 0.35s ease,
        transform 0.35s ease;
    }

    /* 덕양중 제목 */
    .project-title{
      position:absolute;
      top:50%;
      left:50%;
      width:80%;
      margin:0;
      padding:0;
      transform:translate(-50%, -50%);

      color:#fff;
      font-size:15px;
      font-weight:500;
      line-height:1.4;
      letter-spacing:0.02em;
      text-align:center;
      text-shadow:0 2px 10px rgba(0, 0, 0, 0.45);

      opacity:0;
      transition:opacity 0.25s ease;
    }

    /*
      클릭 가능한 덕양중에만
      마우스 오버 효과 적용
    */
    .project-link:hover .thumb img{
      filter:blur(3px) brightness(0.9);
      transform:scale(1.03);
    }

    .project-link:hover .project-title{
      opacity:1;
    }

    /* 중간 화면 */
    @media (max-width:1200px){
      .grid{
        gap:28px;
      }

      .project{
        flex-basis:calc((100vw - 40px - 84px) / 3);
        min-width:260px;
      }
    }

    /* 태블릿 */
    @media (max-width:820px){
      .container{
        width:calc(100% - 24px);
        margin:28px 0 60px 24px;
      }

      .site-header{
        margin-bottom:44px;
      }

      .grid{
        gap:24px;
      }

      .project{
        flex-basis:calc((100vw - 24px - 48px) / 2);
        min-width:240px;
      }
    }

    /* 모바일 */
    @media (max-width:520px){
      .project{
        flex-basis:calc(100vw - 72px);
        min-width:0;
      }
    }

    /*
      터치 기기에서는 덕양중 제목을
      이미지 위에 항상 표시
    */
    @media (hover:none){
      .project-link .project-title{
        opacity:1;
      }
    }

    /* 모션 최소화 설정 사용자 */
    @media (prefers-reduced-motion:reduce){
      .thumb img,
      .project-title{
        transition:none;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="site-header">
      <a href="/about.html" class="logo">
        건축사사무소 스튜디오501
      </a>
    </header>

    <div class="project-viewport">
      <main class="grid">

        <!-- 덕양중: 클릭 가능 -->
        <a
          class="project project-link"
          href="projects/deokyang.html"
        >
          <div class="thumb">
            <img
              src="images/deokyang-thumb.jpg"
              alt="덕양중학교 공간재구조화 리모델링 및 증축"
            >
            <div class="project-title">
              덕양중학교 공간재구조화
            </div>
          </div>
        </a>

        <!-- 삼상초: 썸네일만 표시 -->
        <div class="project project-static">
          <div class="thumb">
            <img
              src="images/samsang-thumb.jpg"
              alt="삼상초등학교 공간재구조화 리모델링 및 급식실 증개축"
            >
          </div>
        </div>

        <!-- 원덕초: 썸네일만 표시 -->
        <div class="project project-static">
          <div class="thumb">
            <img
              src="images/wondeok-thumb.jpg"
              alt="원덕초 그린스마트미래학교 증개축"
            >
          </div>
        </div>

        <!-- 의령여중: 썸네일만 표시 -->
        <div class="project project-static">
          <div class="thumb">
            <img
              src="images/uiryeong-thumb.jpg"
              alt="의령여중 미래학교 본관동 개축"
            >
          </div>
        </div>

        <!-- 금당초: 썸네일만 표시 -->
        <div class="project project-static">
          <div class="thumb">
            <img
              src="images/geumdang-thumb.jpg"
              alt="금당초등학교 본관동 개축"
            >
          </div>
        </div>

        <!-- 한국소방안전원: 썸네일만 표시 -->
        <div class="project project-static">
          <div class="thumb">
            <img
              src="images/fire-safety-thumb.jpg"
              alt="한국소방안전원 온라인스튜디오"
            >
          </div>
        </div>

        <!-- 공항동: 썸네일만 표시 -->
        <div class="project project-static">
          <div class="thumb">
            <img
              src="images/airportdong-thumb.jpg"
              alt="공항동 다가구 상가주택"
            >
          </div>
        </div>

      </main>
    </div>

  </div>

  <script>
    const viewport = document.querySelector(".project-viewport");
    const track = document.querySelector(".grid");

    const originalProjects = Array.from(track.children);

    /*
      무한 반복을 위해 프로젝트 전체를
      한 번 더 복제
    */
    originalProjects.forEach((project) => {
      const clone = project.cloneNode(true);
      clone.setAttribute("aria-hidden", "true");

      /*
        복제된 링크는 키보드 탐색에서 제외
        마우스 클릭은 정상 작동
      */
      if(clone.matches("a")){
        clone.setAttribute("tabindex", "-1");
      }

      track.appendChild(clone);
    });

    let position = 0;
    let previousTime = null;
    let paused = false;
    let originalWidth = 0;

    /*
      자동 이동 속도
      숫자가 작을수록 느리게 움직임
    */
    const speed = 16;

    function calculateWidth(){
      const gap =
        parseFloat(window.getComputedStyle(track).gap) || 0;

      originalWidth = originalProjects.reduce(
        (total, project) => {
          return total + project.getBoundingClientRect().width;
        },
        0
      );

      originalWidth += gap * originalProjects.length;
    }

    function animate(currentTime){
      if(previousTime === null){
        previousTime = currentTime;
      }

      const elapsed = currentTime - previousTime;
      previousTime = currentTime;

      if(!paused && originalWidth > 0){
        position += speed * (elapsed / 1000);

        if(position >= originalWidth){
          position -= originalWidth;
        }

        /*
          프로젝트는 왼쪽으로 이동하고
          다음 이미지가 오른쪽에서 들어옴
        */
        track.style.transform =
          `translate3d(${-position}px, 0, 0)`;
      }

      requestAnimationFrame(animate);
    }

    /* 마우스를 올리면 이동 정지 */
    viewport.addEventListener("mouseenter", () => {
      paused = true;
    });

    /* 마우스를 빼면 다시 이동 */
    viewport.addEventListener("mouseleave", () => {
      paused = false;
    });

    window.addEventListener("resize", () => {
      calculateWidth();

      if(position >= originalWidth){
        position = 0;
      }
    });

    window.addEventListener("load", () => {
      calculateWidth();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
