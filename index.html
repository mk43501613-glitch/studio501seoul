  >

  <link rel="canonical" href="https://studio501seoul.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="건축사사무소 스튜디오501">
  <meta property="og:title" content="건축사사무소 스튜디오501">
  <meta
    property="og:description"
    content="학교 공간재구조화, 리모델링 및 증·개축, 공공건축 프로젝트를 수행합니다."
  >
  <meta property="og:url" content="https://studio501seoul.com/">
  <meta
    property="og:image"
    content="https://studio501seoul.com/images/deokyang-thumb.jpg"
  >

  <link rel="icon" href="/favicon.ico?v=99" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=3">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, "Malgun Gothic", sans-serif;
      background:#fff;
      color:#111;
    }

    /*
      About 페이지와 동일한 기준선
      왼쪽 40px / 위쪽 44px
    */
    .container{
      width:calc(100% - 80px);
      max-width:1600px;
      margin:44px 0 80px 40px;
      padding:0;
    }

    /* 상단 로고 */
    .site-header{
      margin:0 0 52px;
    }

    .logo{
      display:inline-block;
      color:#111;
      font-size:14px;
      font-weight:600;
      letter-spacing:-0.02em;
      text-decoration:none;
    }

    .logo:hover{
      opacity:0.55;
    }

    /* 프로젝트: 데스크톱 가로 4개 */
    .grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:32px;
    }

    .project{
      display:block;
      color:#000;
      text-decoration:none;
    }

    .thumb{
      position:relative;
      width:100%;
      aspect-ratio:4 / 3;
      overflow:hidden;
      background:#f2f2f2;
    }

    .thumb img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      transition:
        filter 0.35s ease,
        transform 0.35s ease;
    }

    .project-title{
      position:absolute;
      top:50%;
      left:50%;
      width:80%;
      margin:0;
      padding:0;
      transform:translate(-50%, -50%);

      color:#fff;
      font-size:15px;
      font-weight:500;
      line-height:1.4;
      letter-spacing:0.02em;
      text-align:center;
      text-shadow:0 2px 10px rgba(0, 0, 0, 0.45);

      opacity:0;
      transition:opacity 0.25s ease;
    }

    .project:hover .thumb img{
      filter:blur(3px) brightness(0.9);
      transform:scale(1.03);
    }

    .project:hover .project-title{
      opacity:1;
    }

    /* 중간 화면: 가로 3개 */
    @media (max-width:1200px){
      .grid{
        grid-template-columns:repeat(3, minmax(0, 1fr));
        gap:28px;
      }
    }

    /* 태블릿: 가로 2개 */
    @media (max-width:820px){
      .container{
        width:calc(100% - 48px);
        margin:28px 24px 60px;
      }

      .site-header{
        margin-bottom:44px;
      }

      .grid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
        gap:24px;
      }
    }

    /* 모바일: 가로 1개 */
    @media (max-width:520px){
      .grid{
        grid-template-columns:1fr;
        gap:24px;
      }
    }

    /* 터치 기기에서는 제목 표시 */
    @media (hover:none){
      .project-title{
        opacity:1;
      }

      .thumb img{
        filter:none;
        transform:none;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="site-header">
      <a href="/about.html" class="logo">
        건축사사무소 스튜디오501

    <main class="grid">

          >

      <a class="project" href="projects/uiryeong.html">

    </main>

</body>
</html>
